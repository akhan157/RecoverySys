[package]
name = "recoverysys"
version = "1.3.0-rc.3"
description = "Recovery bay configuration tool for high-power rocketry"
authors = ["RecoverySys"]
edition = "2021"

[lib]
name = "recoverysys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Test-only embedded WebDriver server used by RecoverySys/e2e-desktop on macOS.
# Never enable this for a shipped build.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
