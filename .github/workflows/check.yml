name: Node checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    defaults:
      run:
        working-directory: RecoverySys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: RecoverySys/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check independent analytic references
        if: matrix.node == '22'
        run: |
          echo "ANALYTIC_ARTIFACT_ROOT=$(realpath -m "$GITHUB_WORKSPACE/../RecoverySys-artifacts/online-validation-2026-11-05/physics")" >> "$GITHUB_ENV"
          python3 --version
          node --test --test-concurrency=2 validation/online-benchmarks-2026-11-05/adapter.test.js
          node validation/online-benchmarks-2026-11-05/run-benchmarks.js
      - name: Upload analytic comparison evidence
        if: ${{ always() && matrix.node == '22' && env.ANALYTIC_ARTIFACT_ROOT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: analytic-comparisons-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ env.ANALYTIC_ARTIFACT_ROOT }}/run-*/
      - run: npx playwright install --with-deps chromium
        if: matrix.node == '22'
      - run: npm run e2e
        if: matrix.node == '22'
        env:
          E2E_ARTIFACT_ONLY: '1'
      - name: Upload E2E evidence
        if: ${{ always() && matrix.node == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-pr-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            RecoverySys/playwright-report/
            RecoverySys/test-results/

      - name: Package checked web artifact
        if: matrix.node == '22'
        run: |
          zip -qr RecoverySys-web.zip dist
          sha256sum RecoverySys-web.zip > RecoverySys-web.sha256
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: web-candidate-${{ github.run_id }}
          path: |
            RecoverySys/RecoverySys-web.zip
            RecoverySys/RecoverySys-web.sha256

  windows-portable:
    name: Windows portable build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RecoverySys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: RecoverySys/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run portable:build
      - name: Assert portable archive contents
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'RecoverySys-Portable.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Archive missing.' }
          $extract = Join-Path $PWD 'portable-verify'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $files = @(Get-ChildItem -LiteralPath $extract -File -Recurse | ForEach-Object { $_.FullName.Substring($extract.Length + 1).Replace('\', '/') })
          if ($files -notcontains 'RecoverySys.exe' -or $files -notcontains 'README.txt') { throw 'Required files missing.' }
          if ($files | Where-Object { $_ -match '\.zip$' }) { throw 'Nested ZIP found.' }
          $marker = 'RECOVERYSYS_E2E_WEBDRIVER_MARKER'
          $exeBytes = [System.IO.File]::ReadAllBytes((Join-Path $extract 'RecoverySys.exe'))
          $exeAscii = [System.Text.Encoding]::ASCII.GetString($exeBytes)
          if ($exeAscii.Contains($marker)) { throw 'Shipped portable exe contains the E2E WebDriver marker.' }
          New-Item -ItemType Directory -Force platform-evidence | Out-Null
          'Release exe does not contain the E2E WebDriver marker.' | Out-File platform-evidence/windows-e2e-marker.txt
          Get-FileHash -Algorithm SHA256 $archive | Format-List | Out-File platform-evidence/windows-sha256.txt
          $process = Start-Process -FilePath (Join-Path $extract 'RecoverySys.exe') -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) { throw "Portable app exited early: $($process.ExitCode)" }
            "Process remained alive for 15 seconds. This is a launch smoke check, not a manual workflow review." | Out-File platform-evidence/windows-launch.txt
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Detect installed WebView2 runtime version
        shell: pwsh
        run: |
          $productKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = $null
          foreach ($key in $productKeys) {
            if (Test-Path -LiteralPath $key) {
              $candidate = (Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue).pv
              if ($candidate) { $version = $candidate; break }
            }
          }
          if (-not $version) { throw 'Could not detect the installed WebView2 Evergreen runtime version.' }
          "EDGEDRIVER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Detected WebView2 runtime $version; msedgedriver will be pinned to this version."
      - name: Install pinned tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Reset desktop app processes and webview data
        shell: pwsh
        run: |
          Get-Process -Name RecoverySys,msedgewebview2 -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $data = Join-Path $env:LOCALAPPDATA 'com.recoverysys.desktop'
          if (Test-Path -LiteralPath $data) {
            Remove-Item -LiteralPath $data -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Configure WebView2 remote debugging policy
        shell: pwsh
        run: |
          # WebView2 Runtime 150+ drops WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          # when the host process is elevated, which GitHub Windows runners are.
          # msedgedriver enables the DevTools port through that environment
          # variable, so grant it through the HKLM policy instead. This runner
          # is throwaway; no developer machine or shipped app is changed.
          $policy = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'RecoverySys.exe' `
            -Value '--remote-debugging-port=0 --enable-automation --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection' `
            -PropertyType String -Force | Out-Null
          $value = (Get-ItemProperty -Path $policy -Name 'RecoverySys.exe').'RecoverySys.exe'
          if (-not $value) { throw 'WebView2 policy was not written.' }
          "WebView2 policy for RecoverySys.exe: $value"
      - name: Install desktop E2E dependencies
        working-directory: ${{ github.workspace }}/RecoverySys/e2e-desktop
        run: npm ci
      - name: Run desktop E2E against the shipped Windows portable exe
        shell: pwsh
        env:
          RECOVERYSYS_E2E_APP: ${{ github.workspace }}\RecoverySys\portable-verify\RecoverySys.exe
        run: |
          New-Item -ItemType Directory -Force e2e-desktop/artifacts | Out-Null
          Push-Location e2e-desktop
          try {
            npx wdio run wdio.conf.js 2>&1 | Tee-Object -FilePath artifacts/wdio-run.log
            if ($LASTEXITCODE -ne 0) { throw "Desktop E2E failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-e2e-windows-${{ github.run_id }}
          if-no-files-found: warn
          path: RecoverySys/e2e-desktop/artifacts/
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-portable-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            RecoverySys/RecoverySys-Portable.zip
            RecoverySys/platform-evidence/

  macos-portable:
    name: macOS universal portable build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: RecoverySys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: RecoverySys/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run portable:macos:build
      - name: Inspect macOS universal archive
        run: |
          test -f RecoverySys-macos-universal.zip
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k RecoverySys-macos-universal.zip "$verify_dir"
          app="$verify_dir/RecoverySys.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          if strings "$app/Contents/MacOS/RecoverySys" | grep -q 'RECOVERYSYS_E2E_WEBDRIVER_MARKER'; then
            echo "Shipped universal app contains the E2E WebDriver marker" >&2
            exit 1
          fi
          archs="$(lipo -archs "$app/Contents/MacOS/RecoverySys")"
          [[ " $archs " == *" arm64 "* ]] || { echo "arm64 slice missing: $archs"; exit 1; }
          [[ " $archs " == *" x86_64 "* ]] || { echo "x86_64 slice missing: $archs"; exit 1; }

          mkdir -p platform-evidence
          printf '%s\n' 'Release app does not contain the E2E WebDriver marker.' > platform-evidence/macos-e2e-marker.txt
          shasum -a 256 RecoverySys-macos-universal.zip > platform-evidence/macos-sha256.txt
          printf '%s\n' "$archs" > platform-evidence/macos-architectures.txt
          "$app/Contents/MacOS/RecoverySys" > platform-evidence/macos-launch.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; rm -rf "$verify_dir"' EXIT
          sleep 15
          kill -0 "$app_pid"
          printf '%s\n' 'Process remained alive for 15 seconds on the runner architecture; manual workflow review remains open.' > platform-evidence/macos-launch.txt
      - name: Build macOS feature-flagged E2E app
        run: |
          npm run tauri:build -- --no-bundle --features e2e
          test -x src-tauri/target/release/RecoverySys
          if ! strings src-tauri/target/release/RecoverySys | grep -q 'RECOVERYSYS_E2E_WEBDRIVER_MARKER'; then
            echo "E2E test build is missing the embedded WebDriver marker" >&2
            exit 1
          fi
          printf '%s\n' 'E2E test build contains the embedded WebDriver marker; this binary is not shipped.' > platform-evidence/macos-e2e-build.txt
      - name: Install desktop E2E dependencies
        working-directory: ${{ github.workspace }}/RecoverySys/e2e-desktop
        run: npm ci
      - name: Run desktop E2E against the feature-flagged macOS test build
        env:
          RECOVERYSYS_E2E_APP: ${{ github.workspace }}/RecoverySys/src-tauri/target/release/RecoverySys
        run: |
          mkdir -p e2e-desktop/artifacts
          cd e2e-desktop
          set -o pipefail
          npx wdio run wdio.conf.js 2>&1 | tee artifacts/wdio-run.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-e2e-macos-${{ github.run_id }}
          if-no-files-found: warn
          path: RecoverySys/e2e-desktop/artifacts/
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-portable-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            RecoverySys/RecoverySys-macos-universal.zip
            RecoverySys/platform-evidence/
